apiVersion: kubocd.kubotal.io/v1alpha1
kind: Release
metadata:
  name: superset
  namespace: okdp-system
spec:
  package:
    repository: quay.io/kubotal/packages-dev/superset
    tag: 0.1.0
  contexts:
    - name: default
      namespace: kubocd-system
  targetNamespace: superset
  createNamespace: true
  parameters:
    adminUser: "admin"
    memory: "2Gi"
    cpu: "500m"
    workers: 2
