apiVersion: kubocd.kubotal.io/v1alpha1
kind: Release
metadata:
  name: trino
  namespace: okdp-system
spec:
  package:
    repository: quay.io/kubotal/packages-dev/trino
    tag: 0.1.0
  contexts:
    - name: default
      namespace: kubocd-system
  targetNamespace: trino
  createNamespace: true
  parameters:
    workers: 1
    coordinatorMemory: "2Gi"
    workerMemory: "2Gi"
    catalogs: "tpch,memory"
