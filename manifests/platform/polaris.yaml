apiVersion: kubocd.kubotal.io/v1alpha1
kind: Release
metadata:
  name: polaris
  namespace: okdp-system
spec:
  package:
    repository: quay.io/okdp/packages-dev/polaris
    tag: 0.1.0
  contexts:
    - name: default
      namespace: kubocd-system
  targetNamespace: polaris
  createNamespace: true
  parameters:
    catalogName: "okdp_catalog"
    s3Bucket: "okdp-warehouse"
    s3Endpoint: "http://minio.minio:9000"
    s3Region: "us-east-1"
    stsEnabled: false
    memory: "1Gi"
